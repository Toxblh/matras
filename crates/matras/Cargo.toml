[package]
name = "matras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
ashpd = "0.12.3"
async-channel = "2.5.0"
cpal = "0.18.2"
emojis = "0.9.0"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
mattermost-api = { path = "../mattermost-api" }
mattermost-calls = { path = "../mattermost-calls" }
oo7 = { version = "0.5.0", default-features = false, features = ["tokio", "native_crypto"] }
opus = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
