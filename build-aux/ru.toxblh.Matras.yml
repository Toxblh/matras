id: ru.toxblh.Matras
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: matras

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Talking to a Mattermost server, and WebRTC for calls.
  - --share=network
  # cpal reaches the microphone through the runtime's ALSA-to-PulseAudio shim.
  - --socket=pulseaudio
  # The session token lives in the Secret Service, not in a file.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-download

modules:
  - name: matras
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/matras/cargo
      # This repository builds from crates.io rather than from a generated
      # offline source list: it is published from our own CI, not Flathub,
      # so a network-isolated build buys nothing but a megabyte of churn in
      # cargo-sources.json on every dependency bump.
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/matras /app/bin/matras
      - install -Dm644 data/ru.toxblh.Matras.desktop /app/share/applications/ru.toxblh.Matras.desktop
      - install -Dm644 data/ru.toxblh.Matras.metainfo.xml /app/share/metainfo/ru.toxblh.Matras.metainfo.xml
      # The icon ships rasterized. Both `flatpak build-export` and
      # appstreamcli load icons through glycin, which has no SVG loader in the
      # GNOME 49/50 SDKs, so an exported SVG fails the build outright. The
      # source of truth is still the SVG in data/.
      - rsvg-convert -w 128 -h 128 -o icon-128.png
        data/icons/hicolor/scalable/apps/ru.toxblh.Matras.svg
      - rsvg-convert -w 256 -h 256 -o icon-256.png
        data/icons/hicolor/scalable/apps/ru.toxblh.Matras.svg
      - install -Dm644 icon-128.png
        /app/share/icons/hicolor/128x128/apps/ru.toxblh.Matras.png
      - install -Dm644 icon-256.png
        /app/share/icons/hicolor/256x256/apps/ru.toxblh.Matras.png
    sources:
      - type: dir
        path: ..
        # Everything the publish script itself writes into the checkout. The
        # ostree repository and the builder's state directory are large; the
        # state directory also holds live mounts, which cannot be copied.
        skip:
          - .git
          - .flatpak-build
          - .flatpak-repo
          - .flatpak-state
          - .pixiewood
          - .android-tools
          - .buildconfig
          - apks
          - subprojects
          - target
