<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android launcher foreground — the same mattress as
  data/icons/hicolor/scalable/apps/ru.toxblh.Matras.svg, with one difference:
  Android VectorDrawable has no <pattern> support (aapt2 rejects
  fill="url(#quilt)"), so the diamond quilting is unrolled into explicit
  stroked diagonals, clipped to the top plane. Same lattice: 24px tile with
  origin (16,26), so the crossings still land on the tufting buttons.
  Keep the two files in sync when the icon design changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="body-clip">
      <path d="M 16 68 L 40 88 L 16 102 Z
               M 30 28 H 98 A 14 14 0 0 1 112 42 V 74 A 14 14 0 0 1 98 88 H 30 A 14 14 0 0 1 16 74 V 42 A 14 14 0 0 1 30 28 Z"/>
    </clipPath>
    <clipPath id="top-clip">
      <path d="M 16 42 A 14 14 0 0 1 30 28 H 98 A 14 14 0 0 1 112 42 V 74 H 16 Z"/>
    </clipPath>
  </defs>

  <!-- Side border panel (the darker front profile) and the bubble tail: Blue 5 -->
  <path id="mattress-side"
        d="M 16 68 L 40 88 L 16 102 Z
           M 30 28 H 98 A 14 14 0 0 1 112 42 V 74 A 14 14 0 0 1 98 88 H 30 A 14 14 0 0 1 16 74 V 42 A 14 14 0 0 1 30 28 Z"
        fill="#1a5fb4"/>

  <!-- Quilted top plane: Blue 1 ticking -->
  <path id="mattress-top"
        d="M 16 42 A 14 14 0 0 1 30 28 H 98 A 14 14 0 0 1 112 42 V 74 H 16 Z"
        fill="#99c1f1"/>

  <!-- The quilting lattice, unrolled from the pattern tile: lines x-y=-10+24k
       and x+y=66+24k across the top plane. -->
  <g id="mattress-quilting" clip-path="url(#top-clip)"
     fill="none" stroke="#62a0ea" stroke-width="1">
    <path d="M -38 20 L 22 80"/>
    <path d="M -14 20 L 46 80"/>
    <path d="M 10 20 L 70 80"/>
    <path d="M 34 20 L 94 80"/>
    <path d="M 58 20 L 118 80"/>
    <path d="M 82 20 L 142 80"/>
    <path d="M 46 20 L -14 80"/>
    <path d="M 70 20 L 10 80"/>
    <path d="M 94 20 L 34 80"/>
    <path d="M 118 20 L 58 80"/>
    <path d="M 142 20 L 82 80"/>
  </g>

  <!-- Piping cord where the top plane meets the side border: Light 3 -->
  <rect id="piping" x="16" y="74" width="96" height="4" fill="#deddda" clip-path="url(#body-clip)"/>

  <!-- Tufting: dips above, buttons below -->
  <g id="tufting-dips" fill="#62a0ea">
    <circle cx="40" cy="46" r="9"/>
    <circle cx="64" cy="46" r="9"/>
    <circle cx="88" cy="46" r="9"/>
  </g>
  <g id="tufting-buttons" fill="#1a5fb4">
    <circle cx="40" cy="50" r="5.5"/>
    <circle cx="64" cy="50" r="5.5"/>
    <circle cx="88" cy="50" r="5.5"/>
  </g>
</svg>
