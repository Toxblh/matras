[workspace]
resolver = "2"
members = ["crates/mattermost-api", "crates/mattermost-calls", "crates/matras", "crates/matras-testserver"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Anton Palgunov <toxblh@gmail.com>"]
repository = "https://github.com/toxblh/matras"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = "0.3"

[profile.release]
# Cross-crate inlining matters in a GTK application built from many thin Rust
# wrappers, while thin LTO keeps release builds practical. One codegen unit
# gives LLVM a coherent view of the hot UI path and also reduces binary size.
lto = "thin"
codegen-units = 1
